<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Neil's DRP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23154733'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23fee123' font-family='Georgia' font-weight='700'>N</text></svg>">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ url_for('main.index') }}" class="brand">
        <span class="brand-mark">N</span>
        <span>Neil's DRP</span>
      </a>
      <nav class="header-nav">
        <span class="header-tag">{{ DRP.school }}</span>
        {% block header_right %}{% endblock %}
      </nav>
    </div>
  </header>

  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>{{ DRP.student_name }} · {{ DRP.department }} · University of Oregon</span>
      <a href="mailto:{{ DRP.contact_email }}">{{ DRP.contact_email }}</a>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
